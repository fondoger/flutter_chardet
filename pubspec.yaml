name: flutter_chardet
description: "Flutter FFI charset detection and decoding using uchardet."
version: 1.0.0
homepage: https://github.com/fondoger/flutter_chardet
repository: https://github.com/fondoger/flutter_chardet
issue_tracker: https://github.com/fondoger/flutter_chardet/issues
topics:
  - charset
  - encoding
  - detection
  - text
  - flutter

environment:
  sdk: ^3.12.1
  flutter: ">=3.41.0"

platforms:
  android:
  ios:
  linux:
  macos:
  windows:

dependencies:
  charset_converter: ^2.4.0
  code_assets: ^1.1.0
  ffi: ^2.1.4
  flutter:
    sdk: flutter
  hooks: ^2.0.0
  native_toolchain_c: ^0.19.0

dev_dependencies:
  crypto: ^3.0.7
  ffigen:
    git:
      url: https://github.com/dart-lang/native.git
      ref: 5e2b3d1171cabe90bae969cd098c85182c1751b3
      path: pkgs/ffigen
  flutter_charset_detector: 6.0.0
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  test: ^1.28.0

dependency_overrides:
  flutter_charset_detector_darwin:
    git:
      url: https://github.com/fondoger/flutter_charset_detector.git
      ref: fix-swift6-result-race
      path: flutter_charset_detector_darwin
