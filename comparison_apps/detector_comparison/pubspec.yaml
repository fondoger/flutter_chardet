name: detector_comparison
description: Compares flutter_chardet with flutter_charset_detector.
publish_to: none

environment:
  sdk: ^3.12.1

dependencies:
  crypto: ^3.0.7
  flutter:
    sdk: flutter
  flutter_chardet:
    path: ../..
  flutter_charset_detector: 6.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

dependency_overrides:
  flutter_charset_detector_darwin:
    git:
      url: https://github.com/fondoger/flutter_charset_detector.git
      ref: fix-swift6-result-race
      path: flutter_charset_detector_darwin
